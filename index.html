<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/script.js"></script>
    <title>PS - ForAll</title>
</head>
    <body>
        <header>
            <div class="encabezado">
                <h1 class="play-regular">PS2 ForAll</h1>

                <nav class="indice-encabezado">
                <a class="indice play-regular" href="index.html">Inicio</a>
                <a class="indice play-regular" href="resenas.html">Reseñas</a>
                <a class="indice play-regular" href="">Catálogo</a>
                </nav>

                <div id="carrito-container">
                    <div id="carrito">
                        <i class="fa-solid fa-cart-arrow-down"></i>
                    </div>
                    <p id="cant-carrito">0</p>
                </div>

            </div>
        </header>

        <main>
            <div class="seccion-de-cards">
                <h2 class="encabezado-de-seccion play-bold">🔥Top 8 en rating🔥</h2>
                <div id="contenedor-cartas-primera-seccion" class="contenedor-carta">

                </div>
            </div>

            <div class="seccion-de-cards">
                <h2 class="encabezado-de-seccion play-bold">Nuestro calálogo</h2>
                <div id="contenedor-catalogo" class="contenedor-carta">
                    
                </div>
            </div>
        </main>

        <footer>
            <div class="seccion-pie-pagina">
                <div class="iframe-mapa">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d54814.618706666326!2d-80.23114229128875!3d25.78003471955122!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2sar!4v1778021556922!5m2!1ses!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
                <h2 class="play-bold">📧Contactános!</h2>
                <form action="https://formspree.io/f/mbdpvjql" method="post">
                    <label class="input-footer-label play-regular" for="nombre">Nombre</label><br>
                    <input class="input-footer-form" type="text" name="name" id="nombre" placeholder="nombre"><br>
                    <label class="input-footer-label play-regular" for="email">Correo</label><br>
                    <input class="input-footer-form" type="email" name="email" id="email" placeholder="email"><br>
                    <label class="input-footer-label play-regular" for="mensaje">Mensaje</label><br>
                    <textarea id="mensaje" name="message" rows="4" cols="30" placeholder="Escribí tu mensaje acá..."></textarea><br>

                    <button type="submit" class="boton-descarga form-button-submit">Enviar</button>
                    <button type="reset" class="boton-descarga form-button-submit">Limpiar</button>
                </form>

            </div>
        </footer>
    </body>
</html>
